[build-system]
requires = [
    "cython>=3.2.4",
    "setuptools>=82.0.0",
    "wheel>=0.46.3"
]
build-backend = "setuptools.build_meta"

[project]
name = "ibm-harmonize-oso-plugins"
dynamic = ["version"]
requires-python = ">= 3.12"


[project.optional-dependencies]
dependencies = [
    "jaraco.context>=6.1.0",
    "urllib3>=2.0.6",
    "six>=1.17.0",
    "requests>=2.31.0",
    "flask>=3.1.3",
    "werkzeug==3.1.5",
    "cryptography>=46.0.5",
    "flask-restx",
    "gunicorn",
    "supervisor",
]
dev = [
    "docker",
    "packaging",
    "pip-tools",
    "pre-commit",
    "podman",
]
test = [
    "coverage",
    "pip",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "requests-mock",
    "requests-toolbelt",
]

[tool.isort]
profile = "black"
filter_files = true
known_first_party = [
    "oso-harmonize-plugins",
    "tests.common",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
update_changelog_on_bump = true

[tool.pytest.ini_options]
pythonpath = "."
addopts = "--import-mode=importlib --cov=oso_harmonize_plugins --cov-report=xml:/tests/results/coverage.xml --junit-xml=/tests/results/junit.xml"

[oso-internal.tooling.versions]
direnv = "2.34.0"
rust = "1.76.0"
